<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手势控制捕鱼游戏</title>
  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(5, 22, 46, .82);
      --line: rgba(144, 224, 255, .32);
      --cyan: #70eaff;
      --gold: #ffd166;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #031326; font-family: system-ui, -apple-system, sans-serif; }
    body { overflow: hidden; }
    #gameCanvas { display: block; width: 100vw; height: 100vh; background: #062d52; }
    #debugCanvas {
      position: fixed; z-index: 3; top: 16px; right: 16px; width: min(28vw, 320px);
      aspect-ratio: 4 / 3; border: 2px solid var(--cyan); border-radius: 12px;
      background: #051525; box-shadow: 0 8px 30px #0008; transform: scaleX(-1);
    }
    #hud {
      position: fixed; z-index: 4; top: 16px; left: 16px; width: min(380px, calc(100vw - 32px));
      padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel);
      backdrop-filter: blur(10px); pointer-events: none;
    }
    .row { display: flex; justify-content: space-between; gap: 14px; align-items: center; }
    .title { color: var(--cyan); font-weight: 800; letter-spacing: .08em; }
    .stats { margin-top: 8px; color: #dff6ff; font-size: 14px; }
    .bar { height: 8px; margin-top: 5px; border-radius: 8px; background: #ffffff1c; overflow: hidden; }
    .fill { height: 100%; width: 0; transition: width .08s linear; background: linear-gradient(90deg, #39d98a, var(--gold), #ff6b6b, #70eaff); background-size: 220% 100%; animation: energyFlow 1.2s linear infinite; }
    .fill.full { animation: energyFlow .35s linear infinite, powerPulse .6s ease-in-out infinite; }
    @keyframes energyFlow { to { background-position: 220% 0; } }
    @keyframes powerPulse { 50% { filter: brightness(2); box-shadow: 0 0 16px var(--gold); } }
    #status { margin-top: 8px; color: #a9c7d9; font-size: 12px; line-height: 1.5; }
    #modePanel {
      position: fixed; z-index: 6; top: 16px; right: 16px; padding: 10px 12px;
      border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
      backdrop-filter: blur(10px); color: #dff6ff; font-size: 13px;
    }
    #modeSelect { margin-left: 6px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 7px; color: #dff6ff; background: #082746; }
    #encyclopediaButton {
      position: fixed; z-index: 6; top: 70px; right: 16px; padding: 8px 12px;
      border: 1px solid var(--line); border-radius: 10px; color: #dff6ff; background: var(--panel);
      cursor: pointer;
    }
    dialog { width: min(680px, calc(100vw - 28px)); max-height: 80vh; border: 1px solid var(--line); border-radius: 16px; color: #dff6ff; background: #061d38; }
    dialog::backdrop { background: #00101dcc; backdrop-filter: blur(4px); }
    .dialogHead { display: flex; justify-content: space-between; align-items: center; color: var(--cyan); }
    #closeEncyclopedia { border: 0; color: #dff6ff; background: transparent; font-size: 22px; cursor: pointer; }
    #encyclopediaGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-top: 12px; }
    .factCard { padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: linear-gradient(145deg, #12446a, #061c35); box-shadow: 0 8px 20px #0005, inset 0 0 18px #70eaff12; transform: perspective(600px) rotateX(0deg); transition: transform .2s, border-color .2s; }
    .factCard:hover { transform: perspective(600px) rotateX(3deg) translateY(-2px); border-color: var(--cyan); }
    .factCard canvas { display: block; width: 100%; height: 100px; margin-bottom: 8px; border-radius: 8px; background: #03182c; }
    .factCard h3 { margin: 4px 0; color: var(--gold); }
    .status-safe { color: #6df39b; } .status-risk { color: #ffd166; } .status-danger { color: #ff7373; }
    .factCard.locked { opacity: .45; filter: grayscale(1); }
    #warning {
      position: fixed; z-index: 10; left: 50%; top: 22%; transform: translateX(-50%);
      display: none; width: min(420px, calc(100vw - 30px)); padding: 16px; border: 2px solid #ff6b6b;
      border-radius: 14px; color: #fff; background: #671f2add; text-align: center; font-weight: 700;
    }
    #unlockToast {
      position: fixed; z-index: 12; top: 112px; right: 18px; opacity: 0; transform: translateY(-10px);
      padding: 11px 15px; border: 1px solid var(--gold); border-radius: 12px; color: #fff6c2;
      background: #382b0ddd; box-shadow: 0 0 22px #ffd16666; transition: opacity .25s, transform .25s;
    }
    #unlockToast.show { opacity: 1; transform: translateY(0); }
    #goldFever {
      position: fixed; z-index: 7; top: 120px; left: 50%; transform: translateX(-50%);
      display: none; padding: 9px 18px; border: 1px solid var(--gold); border-radius: 999px;
      color: #fff4b0; background: #6a421ccc; box-shadow: 0 0 24px #ffd166aa; font-weight: 900;
    }
    #gameOverDialog { text-align: center; }
    #gameOverDialog button { padding: 8px 14px; border: 1px solid var(--cyan); border-radius: 8px; color: #dff6ff; background: #0a3152; cursor: pointer; }
    #roundUnlocks { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin: 14px 0; text-align: left; }
    .roundUnlock { padding: 8px; border: 1px solid var(--gold); border-radius: 8px; color: #ffeaa7; }
    button.roundUnlock { width: 100%; background: #5a421d55; text-align: left; cursor: pointer; }
    .cyber { text-shadow: 0 0 8px currentColor; box-shadow: 0 0 18px #70eaff22, inset 0 0 20px #70eaff0c; }
    body.gold-fever-active #gameCanvas { filter: saturate(1.35) sepia(.25); }
    #start {
      position: fixed; z-index: 5; left: 50%; top: 50%; transform: translate(-50%, -50%);
      padding: 14px 22px; border: 1px solid var(--cyan); border-radius: 999px; color: #031326;
      background: var(--cyan); font-size: 16px; font-weight: 800; cursor: pointer;
      box-shadow: 0 0 25px #70eaff66;
    }
    #start[hidden] { display: none; }
    @media (max-width: 600px) {
      #debugCanvas { top: auto; bottom: 12px; right: 12px; width: 150px; }
      #hud { top: 10px; left: 10px; width: calc(100vw - 20px); }
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <canvas id="debugCanvas" width="640" height="480"></canvas>
  <label id="modePanel">控制模式
    <select id="modeSelect" aria-label="控制模式">
      <option value="gesture">手势控制（MediaPipe）</option>
      <option value="mouse">鼠标控制</option>
      <option value="keyboard">键盘控制</option>
    </select>
  </label>
  <section id="hud">
    <div class="row"><span class="title">GESTURE FISHING</span><strong id="score">金币 0</strong></div>
    <div class="stats row"><span>蓄力 POWER</span><strong id="powerText">0%</strong></div>
    <div class="bar"><div class="fill" id="powerBar"></div></div>
    <div class="stats row"><span>炮台等级 <b id="cannonLevel">1</b></span><span>冰冻 <b id="freezeText">就绪</b></span></div>
    <div id="status">手势：食指瞄准，捏合蓄力并松开射击。鼠标：移动瞄准，按住左键蓄力。键盘：WASD/方向键移动，空格蓄力。</div>
  </section>
  <button id="encyclopediaButton">海洋图鉴</button>
  <dialog id="encyclopediaDialog">
    <div class="dialogHead"><h2>海洋图鉴</h2><button id="closeEncyclopedia" aria-label="关闭">×</button></div>
    <p>捕获或观察新物种即可解锁知识卡片。受保护物种不会加入积分。</p>
    <div id="encyclopediaGrid"></div>
  </dialog>
  <div id="warning" role="alert"></div>
  <div id="unlockToast" role="status"></div>
  <div id="goldFever">★ 黄金狂热 · 无限三连发 ★</div>
  <dialog id="gameOverDialog">
    <div class="dialogHead"><h2>本局结算</h2></div>
    <p id="finalScore"></p>
    <h3>本次新解锁物种</h3>
    <div id="roundUnlocks"></div>
    <button id="restartButton">再来一局</button>
  </dialog>
  <button id="start">启动游戏与摄像头</button>
  <video id="video" playsinline muted hidden></video>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script>
    (() => {
      'use strict';
      const game = document.getElementById('gameCanvas');
      const ctx = game.getContext('2d');
      const debug = document.getElementById('debugCanvas');
      const dctx = debug.getContext('2d');
      const video = document.getElementById('video');
      const start = document.getElementById('start');
      const scoreEl = document.getElementById('score');
      const powerBar = document.getElementById('powerBar');
      const powerText = document.getElementById('powerText');
      const cannonLevelEl = document.getElementById('cannonLevel');
      const freezeText = document.getElementById('freezeText');
      const statusEl = document.getElementById('status');
      const modeSelect = document.getElementById('modeSelect');
      const encyclopediaButton = document.getElementById('encyclopediaButton');
      const encyclopediaDialog = document.getElementById('encyclopediaDialog');
      const encyclopediaGrid = document.getElementById('encyclopediaGrid');
      const closeEncyclopedia = document.getElementById('closeEncyclopedia');
      const warningEl = document.getElementById('warning');
      const unlockToast = document.getElementById('unlockToast');
      const goldFeverEl = document.getElementById('goldFever');
      const gameOverDialog = document.getElementById('gameOverDialog');
      const finalScoreEl = document.getElementById('finalScore');
      const roundUnlocksEl = document.getElementById('roundUnlocks');
      const restartButton = document.getElementById('restartButton');
      const TAU = Math.PI * 2;
      const colors = ['#54d7ff', '#ff79c6', '#ffd166', '#a7f36b'];
      let W = innerWidth, H = innerHeight, last = performance.now(), score = 0;
      let aim = { x: W * .5, y: H * .7 }, targetAim = { x: W * .5, y: H * .7 }, power = 0, cannonLevel = 1;
      let charging = false, chargeStarted = 0, lastShot = 0, freezeUntil = 0, freezeGestureAt = 0;
      let handLandmarks = null, previousTip = null, tipHistory = [], speed = 0, pinch = false, peaceWasOn = false;
      let mode = 'gesture', audio, hands, camera, cameraRunning = false, gameStarted = false;
      let goldFeverUntil = 0, nextGarbageAt = performance.now() + 5000, roundStartedAt = 0, gameOver = false;
      const keys = new Set(), mouseHistory = [];
      const fish = [], shots = [], effects = [], texts = [], garbage = [];
      const newUnlocksThisRound = new Set();
      let garbageCleaned = 0, toastTimer;
      let visualTime = 0, screenShake = 0;
      class ParticleManager {
        constructor() { this.items = []; }
        emit(x, y, count, options = {}) {
          const available = Math.max(0, 700 - this.items.length);
          for (let i = 0; i < Math.min(count, available); i++) {
            const angle = rand(0, TAU), velocity = rand(options.speedMin || 20, options.speedMax || 100);
            this.items.push({
              x, y, vx: Math.cos(angle) * velocity, vy: Math.sin(angle) * velocity,
              life: options.life || .55, max: options.life || .55, size: rand(options.sizeMin || 1.5, options.sizeMax || 4),
              color: options.color || '#bdeeff', gravity: options.gravity || 0, drag: options.drag || .96,
              text: options.text || ''
            });
          }
        }
        update(dt) {
          this.items.forEach(p => { p.life -= dt; p.vx *= p.drag; p.vy = p.vy * p.drag + p.gravity * dt; p.x += p.vx * dt; p.y += p.vy * dt; });
          this.items = this.items.filter(p => p.life > 0);
        }
        draw() {
          this.items.forEach(p => {
            ctx.save(); ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.fillStyle = p.color;
            if (p.text) { ctx.font = `${Math.max(12, p.size * 4)}px system-ui`; ctx.fillText(p.text, p.x, p.y); }
            else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill(); }
            ctx.restore();
          });
        }
      }
      const particles = new ParticleManager();
      const ambientParticles = Array.from({ length: 85 }, () => ({
        x: Math.random() * W, y: Math.random() * H, size: .6 + Math.random() * 1.8,
        phase: Math.random() * TAU, speed: 5 + Math.random() * 13
      }));
      const unlockedFacts = new Set();
      const InputState = {
        mode: 'gesture', aim, power: 0, charging: false, speed: 0, mouseDown: false,
        keys, handSweep: false, feeding: false
      };
      const FishFactsData = {
        clownfish: { name: '小丑鱼', layer: '浅水区', status: '无危', food: '浮游生物 → 小丑鱼', fact: '小丑鱼可以在一生中改变性别。', color: '#ff9f68' },
        shark: { name: '鲨鱼', layer: '中水区', status: '近危', food: '海洋食物链顶端', fact: '鲨鱼通过持续游动让水流过鳃部呼吸。', color: '#b6c7d9' },
        turtle: { name: '绿海龟', layer: '浅水区', status: '濒危 · 受保护', food: '海草 → 海龟', fact: '海龟容易把漂浮的塑料袋误认为水母。', color: '#65d68a' },
        whale: { name: '蓝鲸', layer: '深海区', status: '濒危 · 受保护', food: '磷虾 → 蓝鲸', fact: '蓝鲸是地球上体型最大的动物。', color: '#709dff' },
        angler: { name: '深海鮟鱇鱼', layer: '深海区', status: '无危', food: '小鱼 → 鮟鱇鱼', fact: '头顶发光的“灯笼”能在黑暗中吸引猎物。', color: '#c18cff' }
      };
      const FISH_TYPES = {
        clownfish: { id: 'clownfish', name: '小丑鱼', scientificName: 'Amphiprioninae', category: '珊瑚礁鱼', hp: 1, speed: 34, score: 10, rarity: 'common', width: 42, height: 24, primaryColor: '#f47b35', accentColor: '#fff3df', tailSegments: 3, waterDepth: '浅', conservationStatus: '无危', funFact: '小丑鱼可以在一生中改变性别。', layer: 'surface', pattern: 'clown' },
        butterflyfish: { id: 'butterflyfish', name: '蝴蝶鱼', scientificName: 'Chaetodontidae', category: '珊瑚礁鱼', hp: 2, speed: 28, score: 20, rarity: 'rare', width: 52, height: 31, primaryColor: '#f7c948', accentColor: '#47d7ff', tailSegments: 2, waterDepth: '浅', conservationStatus: '无危', funFact: '蝴蝶鱼细长的吻部适合从珊瑚缝隙中觅食。', layer: 'surface', pattern: 'diamond' },
        snapper: { id: 'snapper', name: '红鲷鱼', scientificName: 'Lutjanus campechanus', category: '珊瑚礁鱼', hp: 2, speed: 25, score: 25, rarity: 'rare', width: 55, height: 34, primaryColor: '#ed5366', accentColor: '#ffd166', tailSegments: 2, waterDepth: '中', conservationStatus: '无危', funFact: '红鲷鱼会在珊瑚礁附近组成小群体巡游。', layer: 'mid', pattern: 'diamond' },
        tang: { id: 'tang', name: '蓝魔鬼/帝王鱼', scientificName: 'Paracanthurus hepatus', category: '珊瑚礁鱼', hp: 2, speed: 31, score: 28, rarity: 'rare', width: 50, height: 34, primaryColor: '#1464d8', accentColor: '#ffd83d', tailSegments: 3, waterDepth: '浅', conservationStatus: '无危', funFact: '帝王鱼的蓝色体色来自特殊的皮肤结构。', layer: 'surface', pattern: 'tang' },
        sardine: { id: 'sardine', name: '小沙丁鱼', scientificName: 'Sardinella spp.', category: '群游鱼', hp: 1, speed: 48, score: 8, rarity: 'common', width: 34, height: 18, primaryColor: '#70d8e8', accentColor: '#e7fbff', tailSegments: 2, waterDepth: '中', conservationStatus: '无危', funFact: '沙丁鱼靠同步转向躲避捕食者。', layer: 'mid', pattern: 'plain', school: true },
        angler: { id: 'angler', name: '深海鮟鱇鱼', scientificName: 'Lophiiformes', category: '深海鱼', hp: 2, speed: 12, score: 32, rarity: 'epic', width: 58, height: 39, primaryColor: '#171425', accentColor: '#c18cff', tailSegments: 2, waterDepth: '深', conservationStatus: '无危', funFact: '头顶发光的诱饵灯能在黑暗中吸引猎物。', layer: 'deep', pattern: 'angler', special: 'glow' },
        turtle: { id: 'turtle', name: '绿海龟', scientificName: 'Chelonia mydas', category: '保护动物', hp: 3, speed: 18, score: 0, rarity: 'legendary', width: 62, height: 49, primaryColor: '#4caa76', accentColor: '#d7b86e', tailSegments: 2, waterDepth: '浅', conservationStatus: '濒危', funFact: '海龟容易把漂浮的塑料袋误认为水母。', layer: 'surface', pattern: 'turtle', protected: true },
        whale: { id: 'whale', name: '蓝鲸', scientificName: 'Balaenoptera musculus', category: '保护动物', hp: 7, speed: 10, score: 0, rarity: 'legendary', width: 112, height: 62, primaryColor: '#477cc5', accentColor: '#8deaff', tailSegments: 3, waterDepth: '深', conservationStatus: '濒危', funFact: '蓝鲸是地球上体型最大的动物。', layer: 'deep', pattern: 'whale', protected: true, boss: true },
        shark: { id: 'shark', name: '大白鲨', scientificName: 'Carcharodon carcharias', category: 'BOSS', hp: 8, speed: 15, score: 120, rarity: 'legendary', width: 108, height: 56, primaryColor: '#778795', accentColor: '#f5f8ff', tailSegments: 3, waterDepth: '中', conservationStatus: '易危', funFact: '大白鲨通过持续游动让水流过鳃部呼吸。', layer: 'mid', pattern: 'shark', special: 'boss', boss: true },
        bomb: { id: 'bomb', name: '炸弹鱼', scientificName: 'Torpedo piscis', category: '特殊鱼种', hp: 1, speed: 22, score: 40, rarity: 'epic', width: 48, height: 31, primaryColor: '#ed5366', accentColor: '#ffd166', tailSegments: 2, waterDepth: '中', conservationStatus: '无危', funFact: '炸弹鱼的爆炸会惊吓周围鱼群。', layer: 'mid', pattern: 'bomb', special: 'bomb' },
        blackhole: { id: 'blackhole', name: '黑洞鱼', scientificName: 'Abyssus vorago', category: '特殊鱼种', hp: 3, speed: 9, score: 55, rarity: 'epic', width: 54, height: 42, primaryColor: '#19152d', accentColor: '#ad75ff', tailSegments: 2, waterDepth: '深', conservationStatus: '无危', funFact: '黑洞鱼会扰动附近的水流和漂浮垃圾。', layer: 'deep', pattern: 'blackhole', special: 'blackhole' }
      };
      const capturedCounts = Object.fromEntries(Object.keys(FISH_TYPES).map(id => [id, 0]));
      class Garbage {
        constructor(type) {
          this.type = type; this.x = rand(30, W - 30); this.y = rand(H * .22, H * .88);
          this.r = 14; this.life = 24; this.dead = false;
        }
        update(dt) { this.life -= dt; this.y += Math.sin(this.life * 2) * dt * 3; if (this.life <= 0) this.dead = true; }
        draw() {
          ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(Math.sin(this.life) * .15);
          ctx.font = '24px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(this.type === 'bottle' ? '🧴' : this.type === 'net' ? '🕸️' : '🥫', 0, 0);
          ctx.restore();
        }
      }
      const rand = (a, b) => a + Math.random() * (b - a);
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const distance = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
      class Fish {
        constructor(typeId, options = {}) {
          this.profile = FISH_TYPES[typeId] || FISH_TYPES.clownfish;
          Object.assign(this, this.profile);
          this.id = this.profile.id; this.value = this.score; this.r = Math.max(this.width, this.height) * .5;
          this.x = options.x ?? 0; this.y = options.y ?? H * .5; this.vx = options.vx ?? this.speed;
          this.hp = this.profile.hp; this.maxHp = this.profile.hp; this.phase = rand(0, TAU);
          this.dead = false; this.flash = 0; this.juice = 0; this.frightened = 0; this.fleeDirection = 1;
          this.schoolId = options.schoolId || null; this.aiTimer = rand(1, 4);
        }
        update(dt, now) {
          if (this.dead) return;
          this.flash = Math.max(0, this.flash - dt); this.juice = Math.max(0, this.juice - dt * 22);
          this.frightened = Math.max(0, this.frightened - dt); this.aiTimer -= dt;
          const direction = Math.sign(this.vx) || 1;
          if (this.frightened > 0) this.vx = direction * this.speed * 2 * this.fleeDirection;
          else if (this.boss && this.aiTimer <= 0) { this.vx = -direction * this.speed; this.aiTimer = rand(4, 8); triggerShake(2); }
          else if (this.schoolId) {
            const schoolmates = fish.filter(other => other !== this && other.schoolId === this.schoolId && !other.dead);
            if (schoolmates.length) {
              const center = schoolmates.reduce((sum, other) => sum + other.x, 0) / schoolmates.length;
              this.vx += clamp(center - this.x, -30, 30) * dt;
              this.vx = clamp(this.vx, -this.speed * 1.2, this.speed * 1.2);
            }
          }
          this.x += this.vx * dt; this.y += Math.sin(now / 700 + this.phase) * dt * (this.schoolId ? 11 : 5);
        }
        hit(damage, sourceX) {
          this.hp -= damage; this.flash = .22; this.juice = 5;
          if (Math.abs(this.x - sourceX) < 180 && this.hp > 0) { this.frightened = 1.5; this.fleeDirection = this.x > sourceX ? 1 : -1; }
        }
        draw() { drawFish(this); }
      }
      function setAimScreen(x, y) {
        targetAim.x = clamp(x, 0, W); targetAim.y = clamp(y, 0, H);
      }
      function updateAim(dt) {
        // Fixed Lerp factor keeps camera hand jitter smooth and predictable.
        aim.x += (targetAim.x - aim.x) * .2;
        aim.y += (targetAim.y - aim.y) * .2;
      }

      function resize() {
        const ratio = Math.min(devicePixelRatio || 1, 2);

          ctx.fillStyle = '#dff8ff'; ctx.shadowBlur = 8; ctx.shadowColor = '#70eaff'; ctx.beginPath(); ctx.arc(fw * .36, -fh * .12, 3, 0, TAU); ctx.fill(); ctx.shadowBlur = 0;
        } else if (p.pattern === 'angler') {
          ctx.fillStyle = f.flash > 0 ? '#fff' : p.primaryColor; ctx.beginPath(); ctx.ellipse(0, 0, fw * .5, fh * .42, 0, 0, TAU); ctx.fill();
          ctx.fillStyle = '#fff'; for (let i = -2; i <= 2; i++) { ctx.beginPath();ctx.moveTo(fw*.2+i*7,fh*.2);ctx.lineTo(fw*.2+i*7+4,fh*.42);ctx.lineTo(fw*.2+i*7+8,fh*.2);ctx.fill(); }
          ctx.strokeStyle = p.accentColor;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(fw*.1,-fh*.3);ctx.quadraticCurveTo(fw*.35,-fh*.8,fw*.55,-fh*.62);ctx.stroke();ctx.fillStyle=p.accentColor;ctx.beginPath();ctx.arc(fw*.55,-fh*.62,6,0,TAU);ctx.fill();
        } else {
          ctx.beginPath(); ctx.ellipse(0, 0, fw * .5, fh * .42, 0, 0, TAU); ctx.fill();
          if (p.pattern === 'clown') { ctx.fillStyle = p.accentColor; ctx.globalAlpha = .85; for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.ellipse(i * fw * .2, 0, fw * .055, fh * .44, 0, 0, TAU); ctx.fill(); } ctx.globalAlpha = 1; }
          if (p.boss) { ctx.strokeStyle = p.accentColor; ctx.lineWidth = 3; ctx.stroke(); }
        }
        ctx.fillStyle = accentColor;
        const segments = Math.max(3, p.tailSegments || 3);
        for (let i = 0; i < segments; i++) {
          const phase = Math.sin(visualTime * (7 + p.speed * .04) - i * .4 + f.phase);
          const x = -fw * (.42 + i * .12), size = fw * (.2 - i * .025);
          ctx.save(); ctx.translate(x, phase * fh * .14); ctx.rotate(phase * .22);
          ctx.beginPath(); ctx.ellipse(0, 0, size, fh * (.28 - i * .015), 0, 0, TAU); ctx.fill(); ctx.restore();
        }
        ctx.fillStyle = '#071325'; ctx.beginPath(); ctx.arc(fw * .32, -fh * .1, Math.max(2, fw * .045), 0, TAU); ctx.fill();
        if (f.hp < f.maxHp && !f.dead) {
          ctx.fillStyle = '#240f22'; ctx.fillRect(-fw * .5, -fh * .72, fw, 4); ctx.fillStyle = f.hp / f.maxHp < .35 ? '#ff5364' : '#ffd166'; ctx.fillRect(-fw * .5, -fh * .72, fw * clamp(f.hp / f.maxHp, 0, 1), 4);
        }
        if (p.boss) { ctx.fillStyle = '#301827'; ctx.fillRect(-fw * .5, -fh * .9, fw, 6); ctx.fillStyle = '#ff5364'; ctx.fillRect(-fw * .5, -fh * .9, fw * clamp(f.hp / f.maxHp, 0, 1), 6); }
        ctx.restore();
      }
      function drawBackground(now) {
        const gradient = ctx.createLinearGradient(0, 0, 0, H); gradient.addColorStop(0, '#0b527e'); gradient.addColorStop(.55, '#063456'); gradient.addColorStop(1, '#010b1c');
        ctx.fillStyle = gradient; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#0a1e3aaa'; ctx.beginPath(); ctx.moveTo(0, H * .76);
        for (let x = 0; x <= W; x += 80) ctx.lineTo(x, H * .71 + Math.sin(x * .012) * 35);
        ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
        ctx.strokeStyle = '#2d9a8c66'; ctx.lineWidth = 5;
        for (let x = 35; x < W; x += 120) { ctx.beginPath(); ctx.moveTo(x, H); ctx.quadraticCurveTo(x - 20, H * .82, x + Math.sin(now * .001 + x) * 16, H * .67); ctx.stroke(); }
        ctx.save(); ctx.globalAlpha = .12; ctx.strokeStyle = '#b7f4ff'; ctx.lineWidth = 2;
        for (let i = 0; i < 9; i++) { ctx.beginPath(); for (let x = -20; x < W + 20; x += 18) { const y = H * .1 + i * 14 + Math.sin(x * .025 + now * .0007 + i) * 9; if (x === -20) ctx.moveTo(x, y); else ctx.lineTo(x, y); } ctx.stroke(); } ctx.restore();
        ambientParticles.forEach(p => { ctx.globalAlpha = .25 + p.size / 6; ctx.fillStyle = '#c8f8ff'; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill(); }); ctx.globalAlpha = 1;
      }
      function draw(now) {
        ctx.save(); if (screenShake) ctx.translate(rand(-screenShake, screenShake), rand(-screenShake, screenShake));
        drawBackground(now);
        ctx.fillStyle = '#b5f3ff99'; ctx.font = '12px system-ui'; ctx.fillText('浅水区', 18, H * .22); ctx.fillText('中水区', 18, H * .46); ctx.fillText('深海区', 18, H * .71);
        fish.forEach(drawFish);
        garbage.forEach(item => item.draw());
        if (now < goldFeverUntil) { ctx.fillStyle = '#ffd16618'; ctx.fillRect(0, 0, W, H); ctx.fillStyle = '#fff0a0'; ctx.font = 'bold 22px system-ui'; ctx.textAlign = 'center'; ctx.fillText('黄金狂热 · 金币 x2 · 三连发', W / 2, H * .16); ctx.textAlign = 'left'; }
        shots.forEach(s => { const p = clamp(s.t, 0, 1), x = W * .5 + (s.tx - W * .5) * p, y = H - 46 + (s.ty - (H - 46)) * p; ctx.strokeStyle = s.color; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(W * .5, H - 46); ctx.lineTo(x, y); ctx.stroke(); if (s.hit) { ctx.globalAlpha = 1 - s.t + .2; ctx.strokeStyle = s.color; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(s.tx, s.ty, s.radius * (1 + (s.t - 1) * 2), 0, TAU); ctx.stroke(); ctx.globalAlpha = 1; } });
        effects.forEach(e => { ctx.globalAlpha = e.life / e.max; ctx.strokeStyle = e.color; ctx.lineWidth = e.net ? 3 : 2; ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, TAU); if (e.net) { ctx.moveTo(e.x - e.r, e.y); ctx.lineTo(e.x + e.r, e.y); ctx.moveTo(e.x, e.y - e.r); ctx.lineTo(e.x, e.y + e.r); } ctx.stroke(); ctx.globalAlpha = 1; });
        particles.draw();
        ctx.strokeStyle = '#ffffffaa'; ctx.lineWidth = 2; ctx.save(); ctx.translate(aim.x, aim.y); ctx.rotate(visualTime * 1.8); ctx.beginPath(); ctx.arc(0, 0, 18, 0, TAU); ctx.moveTo(-28, 0); ctx.lineTo(-8, 0); ctx.moveTo(8, 0); ctx.lineTo(28, 0); ctx.moveTo(0, -28); ctx.lineTo(0, -8); ctx.moveTo(0, 8); ctx.lineTo(0, 28); ctx.stroke(); ctx.restore();
        ctx.fillStyle = '#d6f5ff'; ctx.fillRect(W / 2 - 34, H - 20, 68, 20); ctx.fillStyle = colors[cannonLevel - 1]; ctx.beginPath(); ctx.arc(W / 2, H - 42, 24, Math.PI, TAU); ctx.fill();
        texts.forEach(t => { ctx.globalAlpha = t.life; ctx.fillStyle = '#ffd166'; ctx.strokeStyle = '#321f50'; ctx.lineWidth = 4; ctx.font = '900 18px system-ui'; ctx.strokeText('+' + t.value + ' 金币', t.x - 25, t.y); ctx.fillText('+' + t.value + ' 金币', t.x - 25, t.y); ctx.globalAlpha = 1; });
        if (now < freezeUntil) { ctx.fillStyle = '#bdeeff18'; ctx.fillRect(0, 0, W, H); ctx.fillStyle = '#dffaff'; ctx.font = 'bold 28px system-ui'; ctx.textAlign = 'center'; ctx.fillText('❄ 全屏冰冻 ❄', W / 2, H * .18); ctx.textAlign = 'left'; }
        ctx.restore();
      }
      function loop(now) {
        const dt = Math.min((now - last) / 1000, .05);
        last = now; update(dt, now); draw(now); requestAnimationFrame(loop);
      }

      modeSelect.addEventListener('change', event => setMode(event.target.value));
      encyclopediaButton.addEventListener('click', () => { renderEncyclopedia(); encyclopediaDialog.showModal(); animateEncyclopediaThumbs(); });
      closeEncyclopedia.addEventListener('click', () => encyclopediaDialog.close());
      encyclopediaDialog.addEventListener('click', event => { if (event.target === encyclopediaDialog) encyclopediaDialog.close(); });
      game.addEventListener('mousemove', event => {
        setAimScreen(event.clientX, event.clientY);
        const now = performance.now();
        mouseHistory.push({ x: event.clientX, y: event.clientY, time: now });
        while (mouseHistory.length > 5) mouseHistory.shift();
        if (mouseHistory.length > 1) {
          const first = mouseHistory[0], elapsed = Math.max((now - first.time) / 1000, 1 / 60);
          speed = Math.hypot(event.clientX - first.x, event.clientY - first.y) / elapsed / 100;
        }
        InputState.aim = aim; InputState.speed = speed;
      });
      game.addEventListener('mousedown', event => {
        if (mode === 'mouse' && event.button === 0) { initAudio(); beginCharge(); }
        if (mode === 'mouse' && event.button === 2) { InputState.mouseDown = true; InputState.feeding = true; }
      });
      addEventListener('mouseup', event => {
        if (mode === 'mouse' && event.button === 0 && charging) shoot();
        if (event.button === 2) { InputState.mouseDown = false; InputState.feeding = false; }
      });
      game.addEventListener('contextmenu', event => event.preventDefault());
      addEventListener('keydown', event => {
        if (mode !== 'keyboard') return;
        const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
        keys.add(key);
        if (key === ' ') { event.preventDefault(); initAudio(); beginCharge(); }
      });
      addEventListener('keyup', event => {
        if (mode === 'keyboard' && event.key === ' ' && charging) { event.preventDefault(); shoot(); }
        keys.delete(event.key.length === 1 ? event.key.toLowerCase() : event.key);
      });
      renderEncyclopedia();
      restartButton.addEventListener('click', () => location.reload());
      roundUnlocksEl.addEventListener('click', event => {
        const button = event.target.closest('[data-read-fish]');
        if (!button) return;
        gameOverDialog.close(); renderEncyclopedia(); encyclopediaDialog.showModal(); animateEncyclopediaThumbs();
      });
      start.addEventListener('click', async () => {
        initAudio(); await audio.resume(); gameStarted = true; gameOver = false; roundStartedAt = performance.now(); newUnlocksThisRound.clear(); start.hidden = true;
        if (mode === 'gesture') await startCamera();
      });
      requestAnimationFrame(loop);
    })();
  </script>
</body>
