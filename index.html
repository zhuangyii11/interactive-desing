<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手势控制捕鱼游戏</title>
  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(5, 22, 46, .82);
      --line: rgba(144, 224, 255, .32);
      --cyan: #70eaff;
      --gold: #ffd166;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #031326; font-family: system-ui, -apple-system, sans-serif; }
    body { overflow: hidden; }
    #gameCanvas { display: block; width: 100vw; height: 100vh; background: #062d52; }
    #debugCanvas {
      position: fixed; z-index: 3; top: 16px; right: 16px; width: min(28vw, 320px);
      aspect-ratio: 4 / 3; border: 2px solid var(--cyan); border-radius: 12px;
      background: #051525; box-shadow: 0 8px 30px #0008; transform: scaleX(-1);
    }
    #hud {
      position: fixed; z-index: 4; top: 16px; left: 16px; width: min(380px, calc(100vw - 32px));
      padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel);
      backdrop-filter: blur(10px); pointer-events: none;
    }
    .row { display: flex; justify-content: space-between; gap: 14px; align-items: center; }
    .title { color: var(--cyan); font-weight: 800; letter-spacing: .08em; }
    .stats { margin-top: 8px; color: #dff6ff; font-size: 14px; }
    .bar { height: 8px; margin-top: 5px; border-radius: 8px; background: #ffffff1c; overflow: hidden; }
    .fill { height: 100%; width: 0; transition: width .08s linear; background: linear-gradient(90deg, #39d98a, var(--gold), #ff6b6b); }
    #status { margin-top: 8px; color: #a9c7d9; font-size: 12px; line-height: 1.5; }
    #modePanel {
      position: fixed; z-index: 6; top: 16px; right: 16px; padding: 10px 12px;
      border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
      backdrop-filter: blur(10px); color: #dff6ff; font-size: 13px;
    }
    #modeSelect { margin-left: 6px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 7px; color: #dff6ff; background: #082746; }
    #encyclopediaButton {
      position: fixed; z-index: 6; top: 70px; right: 16px; padding: 8px 12px;
      border: 1px solid var(--line); border-radius: 10px; color: #dff6ff; background: var(--panel);
      cursor: pointer;
    }
    dialog { width: min(680px, calc(100vw - 28px)); max-height: 80vh; border: 1px solid var(--line); border-radius: 16px; color: #dff6ff; background: #061d38; }
    dialog::backdrop { background: #00101dcc; backdrop-filter: blur(4px); }
    .dialogHead { display: flex; justify-content: space-between; align-items: center; color: var(--cyan); }
    #closeEncyclopedia { border: 0; color: #dff6ff; background: transparent; font-size: 22px; cursor: pointer; }
    #encyclopediaGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-top: 12px; }
    .factCard { padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #0a3152; }
    .factCard.locked { opacity: .45; filter: grayscale(1); }
    #warning {
      position: fixed; z-index: 10; left: 50%; top: 22%; transform: translateX(-50%);
      display: none; width: min(420px, calc(100vw - 30px)); padding: 16px; border: 2px solid #ff6b6b;
      border-radius: 14px; color: #fff; background: #671f2add; text-align: center; font-weight: 700;
    }
    #start {
      position: fixed; z-index: 5; left: 50%; top: 50%; transform: translate(-50%, -50%);
      padding: 14px 22px; border: 1px solid var(--cyan); border-radius: 999px; color: #031326;
      background: var(--cyan); font-size: 16px; font-weight: 800; cursor: pointer;
      box-shadow: 0 0 25px #70eaff66;
    }
    #start[hidden] { display: none; }
    @media (max-width: 600px) {
      #debugCanvas { top: auto; bottom: 12px; right: 12px; width: 150px; }
      #hud { top: 10px; left: 10px; width: calc(100vw - 20px); }
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <canvas id="debugCanvas" width="640" height="480"></canvas>
  <label id="modePanel">控制模式
    <select id="modeSelect" aria-label="控制模式">
      <option value="gesture">手势控制（MediaPipe）</option>
      <option value="mouse">鼠标控制</option>
      <option value="keyboard">键盘控制</option>
    </select>
  </label>
  <section id="hud">
    <div class="row"><span class="title">GESTURE FISHING</span><strong id="score">金币 0</strong></div>
    <div class="stats row"><span>蓄力 POWER</span><strong id="powerText">0%</strong></div>
    <div class="bar"><div class="fill" id="powerBar"></div></div>
    <div class="stats row"><span>炮台等级 <b id="cannonLevel">1</b></span><span>冰冻 <b id="freezeText">就绪</b></span></div>
    <div id="status">手势：食指瞄准，捏合蓄力并松开射击。鼠标：移动瞄准，按住左键蓄力。键盘：WASD/方向键移动，空格蓄力。</div>
  </section>
  <button id="encyclopediaButton">海洋图鉴</button>
  <dialog id="encyclopediaDialog">
    <div class="dialogHead"><h2>海洋图鉴</h2><button id="closeEncyclopedia" aria-label="关闭">×</button></div>
    <p>捕获或观察新物种即可解锁知识卡片。受保护物种不会加入积分。</p>
    <div id="encyclopediaGrid"></div>
  </dialog>
  <div id="warning" role="alert"></div>
  <button id="start">启动游戏与摄像头</button>
  <video id="video" playsinline muted hidden></video>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script>
    (() => {
      'use strict';
      const game = document.getElementById('gameCanvas');
      const ctx = game.getContext('2d');
      const debug = document.getElementById('debugCanvas');
      const dctx = debug.getContext('2d');
      const video = document.getElementById('video');
      const start = document.getElementById('start');
      const scoreEl = document.getElementById('score');
      const powerBar = document.getElementById('powerBar');
      const powerText = document.getElementById('powerText');
      const cannonLevelEl = document.getElementById('cannonLevel');
      const freezeText = document.getElementById('freezeText');
      const statusEl = document.getElementById('status');
      const modeSelect = document.getElementById('modeSelect');
      const encyclopediaButton = document.getElementById('encyclopediaButton');
      const encyclopediaDialog = document.getElementById('encyclopediaDialog');
      const encyclopediaGrid = document.getElementById('encyclopediaGrid');
      const closeEncyclopedia = document.getElementById('closeEncyclopedia');
      const warningEl = document.getElementById('warning');
      const TAU = Math.PI * 2;
      const colors = ['#54d7ff', '#ff79c6', '#ffd166', '#a7f36b'];
      let W = innerWidth, H = innerHeight, last = performance.now(), score = 0;
      let aim = { x: W * .5, y: H * .7 }, power = 0, cannonLevel = 1;
      let charging = false, chargeStarted = 0, lastShot = 0, freezeUntil = 0, freezeGestureAt = 0;
      let handLandmarks = null, previousTip = null, tipHistory = [], speed = 0, pinch = false, peaceWasOn = false;
      let mode = 'gesture', audio, hands, camera, cameraRunning = false, gameStarted = false;
      let migrationUntil = 0, nextGarbageAt = performance.now() + 5000, lastMigration = performance.now();
      const keys = new Set(), mouseHistory = [];
      const fish = [], shots = [], effects = [], texts = [], garbage = [];
      const unlockedFacts = new Set();
      const InputState = {
        mode: 'gesture', aim, power: 0, charging: false, speed: 0, mouseDown: false,
        keys, handSweep: false, feeding: false
      };
      const FishFactsData = {
        clownfish: { name: '小丑鱼', layer: '浅水区', status: '无危', food: '浮游生物 → 小丑鱼', fact: '小丑鱼可以在一生中改变性别。', color: '#ff9f68' },
        shark: { name: '鲨鱼', layer: '中水区', status: '近危', food: '海洋食物链顶端', fact: '鲨鱼通过持续游动让水流过鳃部呼吸。', color: '#b6c7d9' },
        turtle: { name: '绿海龟', layer: '浅水区', status: '濒危 · 受保护', food: '海草 → 海龟', fact: '海龟容易把漂浮的塑料袋误认为水母。', color: '#65d68a' },
        whale: { name: '蓝鲸', layer: '深海区', status: '濒危 · 受保护', food: '磷虾 → 蓝鲸', fact: '蓝鲸是地球上体型最大的动物。', color: '#709dff' },
        angler: { name: '深海鮟鱇鱼', layer: '深海区', status: '无危', food: '小鱼 → 鮟鱇鱼', fact: '头顶发光的“灯笼”能在黑暗中吸引猎物。', color: '#c18cff' }
      };
      class Garbage {
        constructor(type) {
          this.type = type; this.x = rand(30, W - 30); this.y = rand(H * .22, H * .88);
          this.r = 14; this.life = 24; this.dead = false;
        }
        update(dt) { this.life -= dt; this.y += Math.sin(this.life * 2) * dt * 3; if (this.life <= 0) this.dead = true; }
        draw() {
          ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(Math.sin(this.life) * .15);
          ctx.font = '24px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(this.type === 'bottle' ? '🧴' : this.type === 'net' ? '🕸️' : '🥫', 0, 0);
          ctx.restore();
        }
      }
      const rand = (a, b) => a + Math.random() * (b - a);
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const distance = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

      function resize() {
        const ratio = Math.min(devicePixelRatio || 1, 2);
        W = innerWidth; H = innerHeight; game.width = W * ratio; game.height = H * ratio;
        game.style.width = W + 'px'; game.style.height = H + 'px'; ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        aim.x = clamp(aim.x, 0, W); aim.y = clamp(aim.y, 0, H);
      }
      addEventListener('resize', resize); resize();

      function spawnFish() {
        const type = Math.random();
        const defs = [
          { id: 'clownfish', name: '小丑鱼', r: 16, hp: 1, value: 10, speed: 34, color: '#ff9f68', layer: 'surface' },
          { id: 'clownfish', name: '小鱼', r: 14, hp: 1, value: 8, speed: 38, color: '#70eaff', layer: 'surface' },
          { id: 'shark', name: '鲨鱼', r: 43, hp: 5, value: 80, speed: 15, color: '#b6c7d9', layer: 'mid' },
          { id: 'turtle', name: '绿海龟', r: 25, hp: 3, value: 0, speed: 18, color: '#65d68a', layer: 'surface', protected: true },
          { id: 'whale', name: '蓝鲸', r: 52, hp: 7, value: 0, speed: 10, color: '#709dff', layer: 'deep', protected: true },
          { id: 'angler', name: '鮟鱇鱼', r: 23, hp: 2, value: 32, speed: 12, color: '#c18cff', layer: 'deep', special: 'glow' },
          { id: 'bomb', name: '炸弹鱼', r: 21, hp: 1, value: 40, speed: 22, color: '#ff5e65', layer: 'mid', special: 'bomb' },
          { id: 'blackhole', name: '黑洞鱼', r: 25, hp: 3, value: 55, speed: 9, color: '#19152d', layer: 'deep', special: 'blackhole' }
        ];
        let d = type < .38 ? defs[0] : type < .58 ? defs[1] : type < .73 ? defs[2] : type < .83 ? defs[3] : type < .9 ? defs[4] : defs[5];
        if (type > .96) d = defs[7]; else if (type > .92) d = defs[6];
        const fromLeft = Math.random() < .5;
        const layerY = d.layer === 'surface' ? rand(H * .2, H * .42) : d.layer === 'mid' ? rand(H * .4, H * .68) : rand(H * .65, H * .9);
        fish.push({ ...d, x: fromLeft ? -d.r * 2 : W + d.r * 2, y: layerY,
          vx: (fromLeft ? 1 : -1) * d.speed, hp: d.hp, maxHp: d.hp, phase: rand(0, TAU), dead: false });
      }
      for (let i = 0; i < 15; i++) spawnFish();

      function initAudio() { if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)(); }
      function tone(freq, duration, type = 'sine', gain = .06) {
        if (!audio) return;
        const osc = audio.createOscillator(), amp = audio.createGain();
        osc.type = type; osc.frequency.value = freq; amp.gain.setValueAtTime(gain, audio.currentTime);
        amp.gain.exponentialRampToValueAtTime(.001, audio.currentTime + duration);
        osc.connect(amp).connect(audio.destination); osc.start(); osc.stop(audio.currentTime + duration);
      }
      function unlockFact(id) {
        if (!FishFactsData[id] || unlockedFacts.has(id)) return;
        unlockedFacts.add(id); renderEncyclopedia();
      }
      function renderEncyclopedia() {
        encyclopediaGrid.innerHTML = Object.entries(FishFactsData).map(([id, fact]) => {
          const unlocked = unlockedFacts.has(id);
          return `<article class="factCard ${unlocked ? '' : 'locked'}"><h3>${unlocked ? fact.name : '???'}</h3>` +
            `<div>生活水层：${unlocked ? fact.layer : '未知'}</div><div>保护级别：${unlocked ? fact.status : '未知'}</div>` +
            `<div>食物链：${unlocked ? fact.food : '捕获后解锁'}</div><p>${unlocked ? fact.fact : '探索海洋以解锁知识。'}</p></article>`;
        }).join('');
      }
      function ecologyWarning(message) {
        warningEl.textContent = message; warningEl.style.display = 'block';
        clearTimeout(ecologyWarning.timer); ecologyWarning.timer = setTimeout(() => warningEl.style.display = 'none', 2600);
      }
      function spawnGarbage() {
        if (garbage.length < 7) garbage.push(new Garbage(['bottle', 'net', 'can'][Math.floor(Math.random() * 3)]));
      }
      function clearGarbageAt(x, y, radius) {
        let cleaned = 0;
        garbage.forEach(item => { if (!item.dead && Math.hypot(item.x - x, item.y - y) < radius + item.r) { item.dead = true; cleaned++; } });
        if (cleaned) { score += cleaned * 60; power = clamp(power + cleaned * 25, 0, 100); texts.push({ x, y, value: cleaned * 60, life: 1, label: '生态基金 +' }); tone(980, .15, 'triangle', .08); }
      }
      function feedFish() {
        if (!InputState.feeding) return;
        fish.forEach(f => { if (f.id === 'clownfish' && Math.hypot(f.x - aim.x, f.y - aim.y) < 190) { f.x += (aim.x - f.x) * .012; f.y += (aim.y - f.y) * .012; } });
      }
      function triggerSpecial(f) {
        if (f.special === 'bomb') {
          fish.forEach(other => { if (other !== f && Math.hypot(other.x - f.x, other.y - f.y) < 130) { other.hp -= 2; effects.push({ x: other.x, y: other.y, r: 3, life: .4, max: .4, color: '#ff5e65' }); } });
          ecologyWarning('炸弹鱼爆炸：附近鱼类受到连环冲击！');
        } else if (f.special === 'blackhole') {
          garbage.forEach(item => { item.x += (f.x - item.x) * .7; item.y += (f.y - item.y) * .7; });
          fish.forEach(other => { if (other !== f && other.id === 'clownfish') { other.x += (f.x - other.x) * .25; other.y += (f.y - other.y) * .25; } });
          ecologyWarning('黑洞鱼发动引力：垃圾和小鱼被吸引！');
        }
      }
      function shoot() {
        if (performance.now() - lastShot < 180) return;
        lastShot = performance.now(); const r = 18 + power * .55, fast = speed > 1.05;
        shots.push({ x: W * .5, y: H - 46, tx: aim.x, ty: aim.y, t: 0, duration: fast ? .32 : .48,
          radius: r, damage: 1 + power / 42, color: colors[cannonLevel - 1] });
        tone(190 + power * 3, .16, 'square', .07); power = 0; charging = false;
      }
      function beginCharge() {
        if (!charging) { charging = true; chargeStarted = performance.now(); }
      }
      function updateCharge(now) {
        if (charging && mode !== 'gesture') power = clamp((now - chargeStarted) / 18, 0, 100);
      }
      function setMode(nextMode) {
        if (mode === nextMode) return;
        mode = nextMode; charging = false; power = 0; pinch = false; previousTip = null; tipHistory = [];
        InputState.mode = nextMode; InputState.power = 0; InputState.charging = false; InputState.feeding = false; InputState.handSweep = false;
        if (mode === 'gesture') {
          debug.hidden = false;
          if (gameStarted) startCamera();
          statusEl.textContent = '手势模式：食指瞄准，捏合蓄力并松开射击。✌️切换炮台，🖐️保持 1 秒释放冰冻。';
        } else {
          stopCamera();
          debug.hidden = true;
          statusEl.textContent = mode === 'mouse'
            ? '鼠标模式：移动瞄准，按住左键蓄力，松开射击；快速移动鼠标会加速炮弹。'
            : '键盘模式：WASD/方向键移动准心，按住空格蓄力，松开空格射击。';
        }
      }
      async function startCamera() {
        if (cameraRunning || !gameStarted) return;
        try {
          if (!hands) {
            hands = new Hands({ locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
            hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: .65, minTrackingConfidence: .6 });
            hands.onResults(processHand);
          }
          if (!camera) camera = new Camera(video, { onFrame: async () => hands.send({ image: video }), width: 640, height: 480 });
          await camera.start(); cameraRunning = true;
        } catch (error) {
          console.error(error); statusEl.textContent = '摄像头启动失败：请使用 HTTPS/localhost，并允许摄像头权限。';
        }
      }
      function stopCamera() {
        if (cameraRunning && camera) camera.stop();
        cameraRunning = false; handLandmarks = null; previousTip = null; tipHistory = []; speed = 0;
      }
      function capture(s) {
        let caught = 0;
        clearGarbageAt(s.tx, s.ty, s.radius);
        fish.forEach(f => {
          if (f.dead || Math.hypot(f.x - s.tx, f.y - s.ty) > s.radius + f.r) return;
          unlockFact(f.id);
          f.hp -= s.damage;
          effects.push({ x: f.x, y: f.y, r: 2, life: .45, max: .45, color: s.color });
          if (f.hp <= 0) {
            f.dead = true;
            if (f.protected) { score -= 50; ecologyWarning(`${f.name}为受保护物种，请勿误捕！金币 -50`); }
            else { caught++; score += f.value; texts.push({ x: f.x, y: f.y, value: f.value, life: 1 }); triggerSpecial(f); }
          }
        });
        tone(caught ? 720 : 300, .18, 'sine', caught ? .1 : .04);
      }
      function activateFreeze() {
        if (performance.now() < freezeUntil) return;
        freezeUntil = performance.now() + 15000; tone(880, .5, 'sine', .1);
      }

      function processHand(result) {
        handLandmarks = result.multiHandLandmarks?.[0] || null;
        if (!handLandmarks) { pinch = false; InputState.feeding = false; InputState.handSweep = false; previousTip = null; tipHistory = []; speed = 0; return; }
        const tip = handLandmarks[8], thumb = handLandmarks[4];
        aim.x = clamp((1 - tip.x) * W, 0, W); aim.y = clamp(tip.y * H, 0, H);
        const now = performance.now(), pinchDistance = Math.hypot(tip.x - thumb.x, tip.y - thumb.y);
        pinch = pinchDistance < .075;
        power = pinch ? clamp(Math.max(power, (0.075 - pinchDistance) / .055 * 100) + .12, 0, 100) : power;
        if (pinch && !charging) { charging = true; chargeStarted = now; }
        if (!pinch && charging) shoot();
        if (previousTip) {
          tipHistory.push({ x: tip.x, y: tip.y, time: now });
          if (tipHistory.length > 5) tipHistory.shift();
          const oldest = tipHistory[0], elapsed = Math.max((now - oldest.time) / 1000, 1 / 60);
          speed = Math.hypot(tip.x - oldest.x, tip.y - oldest.y) / elapsed;
        } else {
          tipHistory = [{ x: tip.x, y: tip.y, time: now }];
        }
        previousTip = { x: tip.x, y: tip.y };
        InputState.power = power; InputState.charging = charging; InputState.speed = speed; InputState.aim = aim;
        InputState.handSweep = speed > 1.05;
        InputState.feeding = isOpenHand(handLandmarks);
        if (InputState.handSweep) clearGarbageAt(aim.x, aim.y, 85);
        const peace = isPeace(handLandmarks);
        if (peace && !peaceWasOn) cannonLevel = cannonLevel % 4 + 1;
        peaceWasOn = peace;
        const open = isOpenHand(handLandmarks);
        if (open) { if (!freezeGestureAt) freezeGestureAt = now; if (now - freezeGestureAt > 1000) activateFreeze(); }
        else freezeGestureAt = 0;
        drawDebug(result);
      }
      function isPeace(l) {
        return l[8].y < l[6].y && l[12].y < l[10].y && l[16].y > l[14].y && l[20].y > l[18].y;
      }
      function isOpenHand(l) {
        return l[8].y < l[6].y && l[12].y < l[10].y && l[16].y < l[14].y && l[20].y < l[18].y &&
          Math.hypot(l[4].x - l[17].x, l[4].y - l[17].y) > .22;
      }
      function drawDebug(result) {
        dctx.clearRect(0, 0, debug.width, debug.height); dctx.drawImage(video, 0, 0, debug.width, debug.height);
        const l = result.multiHandLandmarks?.[0]; if (!l) return;
        const links = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
        dctx.strokeStyle = '#70eaff'; dctx.lineWidth = 3; links.forEach(([a,b]) => { dctx.beginPath(); dctx.moveTo(l[a].x*debug.width,l[a].y*debug.height); dctx.lineTo(l[b].x*debug.width,l[b].y*debug.height); dctx.stroke(); });
        dctx.fillStyle = '#ffd166'; l.forEach(p => { dctx.beginPath(); dctx.arc(p.x*debug.width,p.y*debug.height,5,0,TAU); dctx.fill(); });
      }

      function update(dt, now) {
        updateCharge(now);
        InputState.power = power; InputState.charging = charging; InputState.speed = speed;
        if (mode === 'keyboard') {
          const move = 360 * dt;
          if (keys.has('ArrowLeft') || keys.has('a')) aim.x -= move;
          if (keys.has('ArrowRight') || keys.has('d')) aim.x += move;
          if (keys.has('ArrowUp') || keys.has('w')) aim.y -= move;
          if (keys.has('ArrowDown') || keys.has('s')) aim.y += move;
          aim.x = clamp(aim.x, 0, W); aim.y = clamp(aim.y, 0, H);
        }
        if (now > nextGarbageAt) { spawnGarbage(); nextGarbageAt = now + rand(7000, 12000); }
        garbage.forEach(item => item.update(dt));
        if (garbage.some(item => item.life < 1 && !item.dead)) score = Math.max(0, score - dt * 2);
        garbage.splice(0, garbage.length, ...garbage.filter(item => !item.dead));
        feedFish();
        if (now - lastMigration > 30000) {
          migrationUntil = now + 10000; lastMigration = now;
          for (let i = 0; i < 8; i++) fish.push({ id: 'migration', name: '黄金鱼', r: 13, hp: 1, maxHp: 1, value: 35,
            speed: 50, color: '#ffd166', x: -30 - i * 38, y: H * .34 + i * 22, vx: 1, phase: 0, dead: false, gold: true });
          ecologyWarning('黄金鱼群潮来袭！整齐阵型限时出现。');
        }
        if (now - lastShot > 800 && fish.length < 22) spawnFish();
        const frozen = now < freezeUntil;
        fish.forEach(f => { if (!f.dead && !frozen) { f.x += f.vx * dt; f.y += Math.sin(now / 700 + f.phase) * dt * 5; } });
        for (let i = fish.length - 1; i >= 0; i--) if (fish[i].dead || fish[i].x < -120 || fish[i].x > W + 120) fish.splice(i, 1);
        shots.forEach(s => { s.t += dt / s.duration; if (s.t >= 1 && !s.hit) { s.hit = true; capture(s); } });
        while (shots.length && shots[0].t > 1.25) shots.shift();
        effects.forEach(e => { e.life -= dt; e.r += dt * 160; }); while (effects.length && effects[0].life <= 0) effects.shift();
        texts.forEach(t => { t.y -= dt * 34; t.life -= dt; }); while (texts.length && texts[0].life <= 0) texts.shift();
        InputState.aim = aim;
        scoreEl.textContent = '金币 ' + score; powerBar.style.width = power + '%'; powerText.textContent = Math.round(power) + '%';
        cannonLevelEl.textContent = cannonLevel; freezeText.textContent = frozen ? Math.ceil((freezeUntil - now) / 1000) + 's' : '就绪';
      }
      function draw(now) {
        const gradient = ctx.createLinearGradient(0, 0, 0, H); gradient.addColorStop(0, '#0a4b78'); gradient.addColorStop(1, '#02182f');
        ctx.fillStyle = gradient; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#56c7d522'; ctx.fillRect(0, H * .18, W, H * .24);
        ctx.fillStyle = '#123a5d33'; ctx.fillRect(0, H * .42, W, H * .25);
        ctx.fillStyle = '#010b1ccc'; ctx.fillRect(0, H * .67, W, H * .33);
        ctx.fillStyle = '#b5f3ff99'; ctx.font = '12px system-ui'; ctx.fillText('浅水区', 18, H * .22); ctx.fillText('中水区', 18, H * .46); ctx.fillText('深海区', 18, H * .71);
        ctx.fillStyle = '#ffffff0b'; for (let i=0;i<35;i++) { const x=(i*83+now*.02)%W, y=(i*137+now*.04)%H; ctx.beginPath(); ctx.arc(x,y,1+(i%3),0,TAU);ctx.fill(); }
        fish.forEach(f => { ctx.save(); ctx.translate(f.x, f.y); if (f.vx < 0) ctx.scale(-1,1); if (f.special === 'glow') { ctx.shadowBlur = 18; ctx.shadowColor = '#c18cff'; } ctx.fillStyle=f.color; ctx.beginPath();ctx.ellipse(0,0,f.r*1.35,f.r*.7,0,0,TAU);ctx.fill();ctx.beginPath();ctx.moveTo(-f.r,0);ctx.lineTo(-f.r*1.9,-f.r*.7);ctx.lineTo(-f.r*1.9,f.r*.7);ctx.closePath();ctx.fill();ctx.fillStyle='#062d52';ctx.beginPath();ctx.arc(f.r*.65,-f.r*.2,3,0,TAU);ctx.fill();ctx.restore(); });
        garbage.forEach(item => item.draw());
        if (now < migrationUntil) { ctx.fillStyle = '#ffd166'; ctx.font = 'bold 22px system-ui'; ctx.textAlign = 'center'; ctx.fillText('黄金鱼群潮 · 迁徙中', W / 2, H * .16); ctx.textAlign = 'left'; }
        shots.forEach(s => { const p = clamp(s.t,0,1), x=W*.5+(s.tx-W*.5)*p, y=H-46+(s.ty-(H-46))*p; ctx.strokeStyle=s.color;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(W*.5,H-46);ctx.lineTo(x,y);ctx.stroke(); if(s.hit){ctx.globalAlpha=1-s.t+.2;ctx.strokeStyle=s.color;ctx.lineWidth=4;ctx.beginPath();ctx.arc(s.tx,s.ty,s.radius*(1+(s.t-1)*2),0,TAU);ctx.stroke();ctx.globalAlpha=1;} });
        effects.forEach(e=>{ctx.globalAlpha=e.life/e.max;ctx.strokeStyle=e.color;ctx.lineWidth=3;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,TAU);ctx.stroke();ctx.globalAlpha=1;});
        ctx.strokeStyle='#ffffffaa';ctx.lineWidth=2;ctx.beginPath();ctx.arc(aim.x,aim.y,18,0,TAU);ctx.moveTo(aim.x-28,aim.y);ctx.lineTo(aim.x-8,aim.y);ctx.moveTo(aim.x+8,aim.y);ctx.lineTo(aim.x+28,aim.y);ctx.moveTo(aim.x,aim.y-28);ctx.lineTo(aim.x,aim.y-8);ctx.moveTo(aim.x,aim.y+8);ctx.lineTo(aim.x,aim.y+28);ctx.stroke();
        ctx.fillStyle='#d6f5ff';ctx.fillRect(W/2-34,H-20,68,20);ctx.fillStyle=colors[cannonLevel-1];ctx.beginPath();ctx.arc(W/2,H-42,24,Math.PI,TAU);ctx.fill();
        texts.forEach(t=>{ctx.globalAlpha=t.life;ctx.fillStyle='#ffd166';ctx.font='bold 18px system-ui';ctx.fillText('+'+t.value+' 金币',t.x-25,t.y);ctx.globalAlpha=1;});
        if (now < freezeUntil) { ctx.fillStyle='#bdeeff18';ctx.fillRect(0,0,W,H);ctx.fillStyle='#dffaff';ctx.font='bold 28px system-ui';ctx.textAlign='center';ctx.fillText('❄ 全屏冰冻 ❄',W/2, H*.18);ctx.textAlign='left'; }
      }
      function loop(now) { const dt=Math.min((now-last)/1000,.05); last=now; update(dt,now); draw(now); requestAnimationFrame(loop); }

      modeSelect.addEventListener('change', event => setMode(event.target.value));
      encyclopediaButton.addEventListener('click', () => { renderEncyclopedia(); encyclopediaDialog.showModal(); });
      closeEncyclopedia.addEventListener('click', () => encyclopediaDialog.close());
      encyclopediaDialog.addEventListener('click', event => { if (event.target === encyclopediaDialog) encyclopediaDialog.close(); });
      game.addEventListener('mousemove', event => {
        aim.x = event.clientX; aim.y = event.clientY;
        const now = performance.now();
        mouseHistory.push({ x: event.clientX, y: event.clientY, time: now });
        while (mouseHistory.length > 5) mouseHistory.shift();
        if (mouseHistory.length > 1) {
          const first = mouseHistory[0], elapsed = Math.max((now - first.time) / 1000, 1 / 60);
          speed = Math.hypot(event.clientX - first.x, event.clientY - first.y) / elapsed / 100;
        }
        InputState.aim = aim; InputState.speed = speed;
      });
      game.addEventListener('mousedown', event => {
        if (mode === 'mouse' && event.button === 0) { initAudio(); beginCharge(); }
        if (mode === 'mouse' && event.button === 2) { InputState.mouseDown = true; InputState.feeding = true; }
      });
      addEventListener('mouseup', event => {
        if (mode === 'mouse' && event.button === 0 && charging) shoot();
        if (event.button === 2) { InputState.mouseDown = false; InputState.feeding = false; }
      });
      game.addEventListener('contextmenu', event => event.preventDefault());
      addEventListener('keydown', event => {
        if (mode !== 'keyboard') return;
        const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
        keys.add(key);
        if (key === ' ') { event.preventDefault(); initAudio(); beginCharge(); }
      });
      addEventListener('keyup', event => {
        if (mode === 'keyboard' && event.key === ' ' && charging) { event.preventDefault(); shoot(); }
        keys.delete(event.key.length === 1 ? event.key.toLowerCase() : event.key);
      });
      renderEncyclopedia();
      start.addEventListener('click', async () => {
        initAudio(); await audio.resume(); gameStarted = true; start.hidden = true;
        if (mode === 'gesture') await startCamera();
      });
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
